server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options nosniff always;
  location = /remoteEntry.js { try_files $uri =404; add_header Cache-Control "no-cache,no-store,must-revalidate"; add_header Access-Control-Allow-Origin "*" always; }
  location / { try_files $uri =404; add_header Cache-Control "public,max-age=300"; add_header Access-Control-Allow-Origin "*" always; }
}
