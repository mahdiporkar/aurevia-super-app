name: aurevia
services:
  auth-db:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: aurevia_auth, POSTGRES_USER: aurevia, POSTGRES_PASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"}
    volumes: [auth-db:/var/lib/postgresql/data]
    networks: [public-data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U aurevia -d aurevia_auth"], interval: 5s, timeout: 3s, retries: 20}
  openfga-db:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: openfga, POSTGRES_USER: openfga, POSTGRES_PASSWORD: "${OPENFGA_DB_PASSWORD:-change-me}"}
    volumes: [openfga-db:/var/lib/postgresql/data]
    networks: [public-data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U openfga"], interval: 5s, timeout: 3s, retries: 20}
  openfga-migrate:
    image: openfga/openfga:v1.8.16
    command: migrate
    environment: {OPENFGA_DATASTORE_ENGINE: postgres, OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:-change-me}@openfga-db:5432/openfga?sslmode=disable"}
    depends_on: {openfga-db: {condition: service_healthy}}
    networks: [public-data]
  openfga:
    image: openfga/openfga:v1.8.16
    command: run
    environment: {OPENFGA_DATASTORE_ENGINE: postgres, OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:-change-me}@openfga-db:5432/openfga?sslmode=disable", OPENFGA_HTTP_ADDR: "0.0.0.0:8080", OPENFGA_PLAYGROUND_ENABLED: "false"}
    depends_on: {openfga-migrate: {condition: service_completed_successfully}}
    networks: [public-services, public-data]
  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:-change-me}", --appendonly, "yes"]
    volumes: [redis-data:/data]
    networks: [public-data]
    healthcheck: {test: [CMD, redis-cli, -a, "${REDIS_PASSWORD:-change-me}", ping], interval: 5s, timeout: 3s, retries: 20}
  keycloak-db:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: keycloak, POSTGRES_USER: keycloak, POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me}"}
    volumes: [keycloak-db:/var/lib/postgresql/data]
    networks: [public-data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [start-dev, --import-realm]
    environment: {KC_DB: postgres, KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak", KC_DB_USERNAME: keycloak, KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me}", KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}", KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me}", KC_HOSTNAME: "http://localhost:8180", KC_HTTP_ENABLED: "true"}
    volumes: [../keycloak/realm-aurevia.json:/opt/keycloak/data/import/realm-aurevia.json:ro]
    ports: ["127.0.0.1:8180:8080"]
    depends_on: [keycloak-db]
    networks: [public-services, public-data]
  mock-hr:
    image: wiremock/wiremock:3.13.1
    volumes: [../mock-operation:/home/wiremock:ro]
    networks: [operation-services]
  mock-finance:
    image: wiremock/wiremock:3.13.1
    volumes: [../mock-operation:/home/wiremock:ro]
    networks: [operation-services]
  operation-gateway:
    image: nginx:1.29.1-alpine
    volumes: [../mock-operation/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [mock-hr, mock-finance]
    networks: [operation-services, bff-egress]
    # Deliberately no host port: only the BFF network can reach this gateway.
  public-superset-db:
    profiles: [superset]
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: superset_public, POSTGRES_USER: superset_public, POSTGRES_PASSWORD: "${PUBLIC_SUPERSET_DB_PASSWORD:-change-me}"}
    volumes: [public-superset-db:/var/lib/postgresql/data]
    networks: [public-data]
  public-superset:
    profiles: [superset]
    image: apache/superset:5.0.0
    environment: {SUPERSET_SECRET_KEY: "${PUBLIC_SUPERSET_SECRET_KEY:-change-me-public}", SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py}
    volumes: [../superset-public/superset_config.py:/app/pythonpath/superset_config.py:ro]
    depends_on: [public-superset-db]
    networks: [public-services, public-data]
  operation-superset-db:
    profiles: [superset]
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: superset_operation, POSTGRES_USER: superset_operation, POSTGRES_PASSWORD: "${OPERATION_SUPERSET_DB_PASSWORD:-change-me}"}
    volumes: [operation-superset-db:/var/lib/postgresql/data]
    networks: [operation-services]
  operation-superset:
    profiles: [superset]
    image: apache/superset:5.0.0
    environment: {SUPERSET_SECRET_KEY: "${OPERATION_SUPERSET_SECRET_KEY:-change-me-operation}", SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py}
    volumes: [../superset-operation/superset_config.py:/app/pythonpath/superset_config.py:ro]
    depends_on: [operation-superset-db]
    networks: [operation-services]
    # No public network and no host port.
  nginx:
    image: nginx:1.29.1-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/shell/dist:/usr/share/nginx/html:ro
      - ../../apps/mfe-admin/dist:/srv/mfe/admin:ro
      - ../../apps/mfe-hr/dist:/srv/mfe/hr:ro
      - ../../apps/mfe-finance/dist:/srv/mfe/finance:ro
      - ../../apps/mfe-reports/dist:/srv/mfe/reports:ro
    ports: ["8443:8080"]
    networks: [public-services]
networks:
  public-services: {internal: false}
  public-data: {internal: true}
  bff-egress: {internal: true}
  operation-services: {internal: true}
volumes: {auth-db: {}, openfga-db: {}, redis-data: {}, keycloak-db: {}, public-superset-db: {}, operation-superset-db: {}}
