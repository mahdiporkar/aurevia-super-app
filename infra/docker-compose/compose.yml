name: aurevia
services:
  auth-db:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: aurevia_auth, POSTGRES_USER: aurevia, POSTGRES_PASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"}
    volumes: [auth-db:/var/lib/postgresql/data]
    networks: [public-data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U aurevia -d aurevia_auth"], interval: 5s, timeout: 3s, retries: 20}
  openfga-db:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: openfga, POSTGRES_USER: openfga, POSTGRES_PASSWORD: "${OPENFGA_DB_PASSWORD:-change-me}"}
    volumes: [openfga-db:/var/lib/postgresql/data]
    networks: [public-data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U openfga"], interval: 5s, timeout: 3s, retries: 20}
  openfga-migrate:
    image: openfga/openfga:v1.18.1
    command: migrate
    environment: {OPENFGA_DATASTORE_ENGINE: postgres, OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:-change-me}@openfga-db:5432/openfga?sslmode=disable"}
    depends_on: {openfga-db: {condition: service_healthy}}
    networks: [public-data]
  openfga:
    image: openfga/openfga:v1.18.1
    command: run
    environment: {OPENFGA_DATASTORE_ENGINE: postgres, OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:-change-me}@openfga-db:5432/openfga?sslmode=disable", OPENFGA_HTTP_ADDR: "0.0.0.0:8080", OPENFGA_PLAYGROUND_ENABLED: "false"}
    depends_on: {openfga-migrate: {condition: service_completed_successfully}}
    networks: [public-services, public-data]
    ports: ["127.0.0.1:8080:8080"]
  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:-change-me}", --appendonly, "yes"]
    volumes: [redis-data:/data]
    networks: [public-data]
    healthcheck: {test: [CMD, redis-cli, -a, "${REDIS_PASSWORD:-change-me}", ping], interval: 5s, timeout: 3s, retries: 20}
  authorization-service:
    image: aurevia/authorization-service:local
    build: {context: ../.., dockerfile: services/authorization-service/Dockerfile}
    environment:
      AUTH_DB_URL: "jdbc:postgresql://auth-db:5432/aurevia_auth"
      POSTGRES_AUTH_USER: aurevia
      POSTGRES_AUTH_PASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-change-me}"
      OPENFGA_URL: "http://openfga:8080"
      OPENFGA_STORE_ID: "${OPENFGA_STORE_ID}"
      OPENFGA_MODEL_ID: "${OPENFGA_MODEL_ID}"
      AUTH_INTERNAL_USER: "${AUTH_INTERNAL_USER:-bff}"
      AUTH_INTERNAL_PASSWORD: "${AUTH_INTERNAL_PASSWORD:-change-me}"
      DIRECTORY_SYNC_ENABLED: "${DIRECTORY_SYNC_ENABLED:-false}"
      DIRECTORY_LDAP_URL: "ldap://samba-ad:389"
      DIRECTORY_BASE_DN: "DC=aurevia,DC=test"
      DIRECTORY_BIND_DN: "CN=Administrator,CN=Users,DC=aurevia,DC=test"
      DIRECTORY_BIND_PASSWORD: "${SAMBA_ADMIN_PASSWORD:-local-directory-only}"
      DIRECTORY_ISSUER: "http://localhost:8180/realms/aurevia"
    depends_on:
      auth-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      openfga: {condition: service_started}
    networks: [public-services, public-data]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8082/actuator/health | grep -q UP"], interval: 10s, timeout: 5s, retries: 30}
  demo-catalog-init:
    image: postgres:17.6-alpine
    command: [psql, -h, auth-db, -U, aurevia, -d, aurevia_auth, -f, /bootstrap/integration-catalog.sql]
    environment:
      PGPASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"
    volumes: [../demo/integration-catalog.sql:/bootstrap/integration-catalog.sql:ro]
    depends_on:
      authorization-service: {condition: service_healthy}
    networks: [public-data]
  aurevia-bff:
    image: aurevia/superapp-bff:local
    build: {context: ../.., dockerfile: services/superapp-bff/Dockerfile}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-change-me}"
      TOKEN_VAULT_KEY_ID: "${TOKEN_VAULT_KEY_ID}"
      TOKEN_VAULT_KEY_BASE64: "${TOKEN_VAULT_KEY_BASE64}"
      AUTHORIZATION_URL: "http://authorization-service:8082"
      AUTH_INTERNAL_USER: "${AUTH_INTERNAL_USER:-bff}"
      AUTH_INTERNAL_PASSWORD: "${AUTH_INTERNAL_PASSWORD:-change-me}"
      OPERATION_GATEWAY_URL: "http://operation-gateway:80"
      OIDC_AUTHORIZATION_URI: "http://localhost:8180/realms/aurevia/protocol/openid-connect/auth"
      OIDC_TOKEN_URI: "http://keycloak:8080/realms/aurevia/protocol/openid-connect/token"
      OIDC_JWK_SET_URI: "http://keycloak:8080/realms/aurevia/protocol/openid-connect/certs"
      OIDC_USER_INFO_URI: "http://keycloak:8080/realms/aurevia/protocol/openid-connect/userinfo"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-aurevia-bff}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-change-me}"
      LEGACY_ALLOWED_HOSTS: "mock-legacy"
      LEGACY_ALLOWED_PORTS: "8080"
      LEGACY_ALLOW_INSECURE_LOCAL: "true"
      LEGACY_LOCAL_SECRETS_ENABLED: "true"
      LEGACY_LOCAL_SECRETS_JSON: '{"secret://demo/legacy":{"username":"legacy-demo","password":"local-demo-only","version":"fixture-v1"}}'
      TOKEN_EVIDENCE_LOGGING_ENABLED: "true"
    depends_on:
      redis: {condition: service_healthy}
      authorization-service: {condition: service_healthy}
      demo-catalog-init: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
      operation-gateway: {condition: service_started}
    networks: [public-services, public-data, bff-egress]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP"], interval: 10s, timeout: 5s, retries: 30}
  keycloak-db:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: keycloak, POSTGRES_USER: keycloak, POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me}"}
    volumes: [keycloak-db:/var/lib/postgresql/data]
    networks: [public-data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [start-dev, --import-realm]
    environment: {KC_DB: postgres, KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak", KC_DB_USERNAME: keycloak, KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me}", KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}", KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me}", KC_HOSTNAME: "http://localhost:8180", KC_HTTP_ENABLED: "true"}
    volumes: [../keycloak/realm-aurevia.json:/opt/keycloak/data/import/realm-aurevia.json:ro]
    ports: ["127.0.0.1:8180:8080"]
    depends_on: [keycloak-db]
    networks: [public-services, public-data, operation-services]
  samba-ad:
    profiles: [directory]
    build: {context: ../.., dockerfile: infra/samba-ad/Dockerfile}
    hostname: dc1.aurevia.test
    environment:
      SAMBA_ADMIN_PASSWORD: "${SAMBA_ADMIN_PASSWORD:-local-directory-only}"
      SAMBA_TEST_USER_PASSWORD: "${SAMBA_TEST_USER_PASSWORD:-local-user-only}"
    volumes: [samba-ad-data:/var/lib/samba, ../samba-ad/move-ali-to-sales.sh:/config/move-ali-to-sales.sh:ro]
    networks: [public-services, public-data]
    healthcheck: {test: [CMD-SHELL, "samba-tool domain info 127.0.0.1 >/dev/null"], interval: 10s, timeout: 5s, retries: 30}
  keycloak-directory-config:
    profiles: [directory]
    image: quay.io/keycloak/keycloak:26.3.3
    entrypoint: [/bin/sh, /config/configure-samba-ldap.sh]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me}"
      SAMBA_ADMIN_PASSWORD: "${SAMBA_ADMIN_PASSWORD:-local-directory-only}"
    volumes: [../keycloak/configure-samba-ldap.sh:/config/configure-samba-ldap.sh:ro]
    depends_on:
      keycloak: {condition: service_started}
      samba-ad: {condition: service_healthy}
    networks: [public-services]
  mock-hr:
    image: wiremock/wiremock:3.13.1
    volumes: [../mock-operation:/home/wiremock:ro]
    networks: [operation-services]
  mock-finance:
    image: wiremock/wiremock:3.13.1
    volumes: [../mock-operation:/home/wiremock:ro]
    networks: [operation-services]
  mock-legacy:
    image: wiremock/wiremock:3.13.1
    volumes: [../mock-legacy:/home/wiremock:ro]
    # The gateway reaches the protected API on operation-services while the
    # Java BFF reaches only this approved token endpoint on bff-egress.
    networks: [operation-services, bff-egress]
  mock-oauth:
    image: wiremock/wiremock:3.13.1
    volumes: [../mock-oauth:/home/wiremock:ro]
    networks: [operation-services]
  operation-gateway:
    image: nginx:1.29.1-alpine
    volumes: [../mock-operation/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      mock-hr: {condition: service_started}
      mock-finance: {condition: service_started}
      mock-legacy: {condition: service_started}
      mock-oauth: {condition: service_started}
      operation-superset: {condition: service_started, required: false}
    networks: [operation-services, bff-egress]
    # Deliberately no host port: only the BFF network can reach this gateway.
  public-superset:
    profiles: [superset]
    image: aurevia/superset-public-assets:5.0.0
    build: {context: ../.., dockerfile: infra/superset-public/Dockerfile}
    networks: [public-services]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8088/health"], interval: 10s, timeout: 5s, retries: 20}
  operation-superset-db:
    profiles: [superset]
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: superset_operation, POSTGRES_USER: superset_operation, POSTGRES_PASSWORD: "${OPERATION_SUPERSET_DB_PASSWORD:-change-me}"}
    volumes: [operation-superset-db:/var/lib/postgresql/data]
    networks: [operation-services]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U superset_operation -d superset_operation"], interval: 5s, timeout: 3s, retries: 20}
  operation-superset-init:
    profiles: [superset]
    image: aurevia/superset:5.0.0-postgres
    build: {context: ../.., dockerfile: infra/superset/Dockerfile}
    command: [sh, -c, "superset db upgrade && (superset fab create-admin --username admin --firstname Aurevia --lastname Admin --email admin@aurevia.local --password $${SUPERSET_ADMIN_PASSWORD} || true) && superset init && DASHBOARD_COUNT=$$(python -c \"from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ['SUPERSET_DATABASE_URI']); print(e.connect().execute(text('select count(*) from dashboards')).scalar())\") && if [ \"$${SUPERSET_LOAD_EXAMPLES:-yes}\" = \"yes\" ] && [ \"$${DASHBOARD_COUNT}\" = \"0\" ]; then superset load-examples; else echo \"Superset examples already loaded or disabled (dashboards=$${DASHBOARD_COUNT})\"; fi"]
    environment: {SUPERSET_SECRET_KEY: "${OPERATION_SUPERSET_SECRET_KEY:-change-me-operation}", SUPERSET_DATABASE_URI: "postgresql+psycopg2://superset_operation:${OPERATION_SUPERSET_DB_PASSWORD:-change-me}@operation-superset-db:5432/superset_operation", SUPERSET_ADMIN_PASSWORD: "${OPERATION_SUPERSET_ADMIN_PASSWORD:-local-change-me}", SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-yes}", SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py}
    volumes: [../superset-operation/superset_config.py:/app/pythonpath/superset_config.py:ro]
    depends_on: {operation-superset-db: {condition: service_healthy}}
    networks: [operation-services, superset-bootstrap-egress]
  operation-superset:
    profiles: [superset]
    image: aurevia/superset:5.0.0-postgres
    build: {context: ../.., dockerfile: infra/superset/Dockerfile}
    command: [superset, run, -h, 0.0.0.0, -p, "8088", --with-threads]
    environment: {SUPERSET_SECRET_KEY: "${OPERATION_SUPERSET_SECRET_KEY:-change-me-operation}", SUPERSET_DATABASE_URI: "postgresql+psycopg2://superset_operation:${OPERATION_SUPERSET_DB_PASSWORD:-change-me}@operation-superset-db:5432/superset_operation", SUPERSET_REMOTE_USER_ROLE: "${SUPERSET_REMOTE_USER_ROLE:-Gamma}", SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py}
    volumes: [../superset-operation/superset_config.py:/app/pythonpath/superset_config.py:ro]
    depends_on: {operation-superset-init: {condition: service_completed_successfully}}
    networks: [operation-services]
    # No public network and no host port.
  nginx:
    image: nginx:1.29.1-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/shell/dist:/usr/share/nginx/html:ro
    ports: ["8443:8080"]
    networks: [public-services]
    depends_on:
      aurevia-bff: {condition: service_healthy}
  mfe-admin:
    image: nginx:1.29.1-alpine
    volumes: [../mfe/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ../../apps/mfe-admin/dist:/usr/share/nginx/html:ro]
    ports: ["3001:8080"]
  mfe-hr:
    image: nginx:1.29.1-alpine
    volumes: [../mfe/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ../../apps/mfe-hr/dist:/usr/share/nginx/html:ro]
    ports: ["3002:8080"]
  mfe-finance:
    image: nginx:1.29.1-alpine
    volumes: [../mfe/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ../../apps/mfe-finance/dist:/usr/share/nginx/html:ro]
    ports: ["3003:8080"]
  mfe-reports:
    image: nginx:1.29.1-alpine
    volumes: [../mfe/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ../../apps/mfe-reports/dist:/usr/share/nginx/html:ro]
    ports: ["3004:8080"]
networks:
  public-services: {internal: false}
  public-data: {internal: true}
  bff-egress: {internal: true}
  operation-services: {internal: true}
  superset-bootstrap-egress: {internal: false}
volumes: {auth-db: {}, openfga-db: {}, redis-data: {}, keycloak-db: {}, operation-superset-db: {}, samba-ad-data: {}}
