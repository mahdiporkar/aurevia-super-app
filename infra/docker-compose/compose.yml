name: aurevia
services:
  auth-db:
    image: repo.shaparak.com/docker-registry/postgres:17.6-alpine
    environment: {POSTGRES_DB: aurevia_auth, POSTGRES_USER: aurevia, POSTGRES_PASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"}
    volumes: [auth-db:/var/lib/postgresql/data]
    networks: [public-data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U aurevia -d aurevia_auth"], interval: 5s, timeout: 3s, retries: 20}
  openfga-db:
    image: repo.shaparak.com/docker-registry/postgres:17.6-alpine
    environment: {POSTGRES_DB: openfga, POSTGRES_USER: openfga, POSTGRES_PASSWORD: "${OPENFGA_DB_PASSWORD:-change-me}"}
    volumes: [openfga-db:/var/lib/postgresql/data]
    networks: [public-data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U openfga"], interval: 5s, timeout: 3s, retries: 20}
  openfga-migrate:
    image: repo.shaparak.com/docker-registry/openfga/openfga:v1.18.1
    command: migrate
    environment: {OPENFGA_DATASTORE_ENGINE: postgres, OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:-change-me}@openfga-db:5432/openfga?sslmode=disable"}
    depends_on: {openfga-db: {condition: service_healthy}}
    networks: [public-data]
  openfga:
    image: repo.shaparak.com/docker-registry/openfga/openfga:v1.18.1
    command: run
    environment: {OPENFGA_DATASTORE_ENGINE: postgres, OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:-change-me}@openfga-db:5432/openfga?sslmode=disable", OPENFGA_HTTP_ADDR: "0.0.0.0:8080", OPENFGA_PLAYGROUND_ENABLED: "false"}
    depends_on: {openfga-migrate: {condition: service_completed_successfully}}
    networks: [public-services, public-data]
    ports: ["127.0.0.1:8080:8080"]
  redis:
    image: repo.shaparak.com/docker-registry/redis:8.2.1-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:-change-me}", --appendonly, "yes"]
    volumes: [redis-data:/data]
    networks: [public-data]
    healthcheck: {test: [CMD, redis-cli, -a, "${REDIS_PASSWORD:-change-me}", ping], interval: 5s, timeout: 3s, retries: 20}
  authorization-service:
    image: aurevia/authorization-service:local
    build: {context: ../.., dockerfile: services/authorization-service/Dockerfile}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      RESOURCE_TREE_DEVELOPMENT_MUTATIONS_ENABLED: "${RESOURCE_TREE_DEVELOPMENT_MUTATIONS_ENABLED:-false}"
      AUTH_DB_URL: "jdbc:postgresql://auth-db:5432/aurevia_auth"
      POSTGRES_AUTH_USER: aurevia
      POSTGRES_AUTH_PASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-change-me}"
      OPENFGA_URL: "http://openfga:8080"
      OPENFGA_STORE_ID: "${OPENFGA_STORE_ID}"
      OPENFGA_MODEL_ID: "${OPENFGA_MODEL_ID}"
      OPENFGA_RECONCILE_ON_STARTUP: "${OPENFGA_RECONCILE_ON_STARTUP:-true}"
      AUTH_INTERNAL_USER: "${AUTH_INTERNAL_USER:-bff}"
      AUTH_INTERNAL_PASSWORD: "${AUTH_INTERNAL_PASSWORD:-change-me}"
      DIRECTORY_SYNC_ENABLED: "${DIRECTORY_SYNC_ENABLED:-false}"
      DIRECTORY_LDAP_URL: "${DIRECTORY_LDAP_URL:-}"
      DIRECTORY_BASE_DN: "${DIRECTORY_BASE_DN:-}"
      DIRECTORY_BIND_DN: "${DIRECTORY_BIND_DN:-}"
      DIRECTORY_BIND_PASSWORD: "${DIRECTORY_BIND_PASSWORD:-}"
      DIRECTORY_ISSUER: "${DIRECTORY_ISSUER:-}"
      IDENTITY_PROVIDER_ALLOW_HTTP: "true"
      IDENTITY_PROVIDER_ALLOW_PRIVATE_HOSTS: "true"
      UI_ARTIFACT_NETWORK_POLICY: "DEVELOPMENT"
      UI_ARTIFACT_DEVELOPMENT_HOST: "host.docker.internal"
      UI_ARTIFACT_ALLOW_HTTP: "true"
      SUPERSET_NETWORK_POLICY: "DEVELOPMENT"
      SUPERSET_DEVELOPMENT_HOST: "host.docker.internal"
      SUPERSET_ALLOW_HTTP: "true"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      auth-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      openfga: {condition: service_started}
    networks: [public-services, public-data]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8082/actuator/health/readiness | grep -q UP"], interval: 10s, timeout: 5s, retries: 30}
  demo-catalog-init:
    image: repo.shaparak.com/docker-registry/postgres:17.6-alpine
    command: [psql, -h, auth-db, -U, aurevia, -d, aurevia_auth, -f, /bootstrap/integration-catalog.sql]
    environment:
      PGPASSWORD: "${POSTGRES_AUTH_PASSWORD:-change-me}"
    volumes: [../demo/integration-catalog.sql:/bootstrap/integration-catalog.sql:ro]
    depends_on:
      authorization-service: {condition: service_healthy}
    networks: [public-data]
  aurevia-bff:
    image: aurevia/superapp-bff:local
    build: {context: ../.., dockerfile: services/superapp-bff/Dockerfile}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-change-me}"
      TOKEN_VAULT_KEY_ID: "${TOKEN_VAULT_KEY_ID}"
      TOKEN_VAULT_KEY_BASE64: "${TOKEN_VAULT_KEY_BASE64}"
      AUTHORIZATION_URL: "http://authorization-service:8082"
      AUTH_INTERNAL_USER: "${AUTH_INTERNAL_USER:-bff}"
      AUTH_INTERNAL_PASSWORD: "${AUTH_INTERNAL_PASSWORD:-change-me}"
      OPERATION_GATEWAY_URL: "http://operation-gateway:80"
      UI_ARTIFACT_NETWORK_POLICY: "DEVELOPMENT"
      UI_ARTIFACT_DEVELOPMENT_HOST: "host.docker.internal"
      UI_ARTIFACT_ALLOW_HTTP: "true"
      SUPERSET_NETWORK_POLICY: "DEVELOPMENT"
      SUPERSET_DEVELOPMENT_HOST: "host.docker.internal"
      SUPERSET_ALLOW_HTTP: "true"
      IDENTITY_PROVIDER_LOCAL_SECRETS_ENABLED: "true"
      IDENTITY_PROVIDER_LOCAL_SECRETS_JSON: '{"secret://identity/demo-keycloak":"${OIDC_CLIENT_SECRET:-change-me}"}'
      LEGACY_ALLOWED_HOSTS: "mock-legacy"
      LEGACY_ALLOWED_PORTS: "8080"
      LEGACY_ALLOW_INSECURE_LOCAL: "true"
      LEGACY_LOCAL_SECRETS_ENABLED: "true"
      LEGACY_LOCAL_SECRETS_JSON: '{"secret://demo/legacy":{"username":"legacy-demo","password":"local-demo-only","version":"fixture-v1"}}'
      TOKEN_EVIDENCE_LOGGING_ENABLED: "true"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_healthy}
      authorization-service: {condition: service_healthy}
      demo-catalog-init: {condition: service_completed_successfully}
      operation-gateway: {condition: service_started}
    networks: [public-services, public-data, bff-egress]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP"], interval: 10s, timeout: 5s, retries: 30}
  mock-hr:
    image: repo.shaparak.com/docker-registry/wiremock/wiremock:3.13.1
    volumes: [../mock-operation:/home/wiremock:ro]
    networks: [operation-services]
  mock-finance:
    image: repo.shaparak.com/docker-registry/wiremock/wiremock:3.13.1
    volumes: [../mock-operation:/home/wiremock:ro]
    networks: [operation-services]
  mock-legacy:
    image: repo.shaparak.com/docker-registry/wiremock/wiremock:3.13.1
    volumes: [../mock-legacy:/home/wiremock:ro]
    # The gateway reaches the protected API on operation-services while the
    # Java BFF reaches only this approved token endpoint on bff-egress.
    networks: [operation-services, bff-egress]
  mock-oauth:
    image: repo.shaparak.com/docker-registry/wiremock/wiremock:3.13.1
    volumes: [../mock-oauth:/home/wiremock:ro]
    networks: [operation-services]
  operation-gateway:
    image: repo.shaparak.com/docker-registry/nginx:1.29.1-alpine
    volumes: [../mock-operation/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      mock-hr: {condition: service_started}
      mock-finance: {condition: service_started}
      mock-legacy: {condition: service_started}
      mock-oauth: {condition: service_started}
    networks: [operation-services, bff-egress]
    # Deliberately no host port: only the BFF network can reach this gateway.
  nginx:
    image: repo.shaparak.com/docker-registry/nginx:1.29.1-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/shell/dist:/usr/share/nginx/html:ro
    ports: ["8443:8080"]
    networks: [public-services]
    depends_on:
      aurevia-bff: {condition: service_healthy}
networks:
  public-services: {internal: false}
  public-data: {internal: true}
  bff-egress: {internal: true}
  operation-services: {internal: true}
volumes: {auth-db: {}, openfga-db: {}, redis-data: {}}
