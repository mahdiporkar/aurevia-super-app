name: aurevia-identity-demo
services:
  keycloak-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me}"
    volumes: [keycloak-db:/var/lib/postgresql/data]
    networks: [identity-demo]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-change-me}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me}"
      KC_HOSTNAME: "http://localhost:8180"
      KC_HTTP_ENABLED: "true"
    volumes: [../keycloak/realm-aurevia.json:/opt/keycloak/data/import/realm-aurevia.json:ro]
    ports: ["127.0.0.1:8180:8080"]
    depends_on:
      keycloak-db: {condition: service_healthy}
    networks: [identity-demo]
  samba-ad:
    profiles: [directory]
    build: {context: ../.., dockerfile: infra/samba-ad/Dockerfile}
    hostname: dc1.aurevia.test
    environment:
      SAMBA_ADMIN_PASSWORD: "${SAMBA_ADMIN_PASSWORD:-local-directory-only}"
      SAMBA_TEST_USER_PASSWORD: "${SAMBA_TEST_USER_PASSWORD:-local-user-only}"
    volumes:
      - samba-ad-data:/var/lib/samba
      - ../samba-ad/move-ali-to-sales.sh:/config/move-ali-to-sales.sh:ro
    ports: ["127.0.0.1:1389:389"]
    networks: [identity-demo]
    healthcheck:
      test: [CMD-SHELL, "samba-tool domain info 127.0.0.1 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  keycloak-directory-config:
    profiles: [directory]
    image: quay.io/keycloak/keycloak:26.3.3
    entrypoint: [/bin/sh, /config/configure-samba-ldap.sh]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me}"
      SAMBA_ADMIN_PASSWORD: "${SAMBA_ADMIN_PASSWORD:-local-directory-only}"
    volumes: [../keycloak/configure-samba-ldap.sh:/config/configure-samba-ldap.sh:ro]
    depends_on:
      keycloak: {condition: service_started}
      samba-ad: {condition: service_healthy}
    networks: [identity-demo]
networks:
  identity-demo: {}
volumes:
  keycloak-db: {}
  samba-ad-data: {}
