name: aurevia-authorization-model
model_file: ./model.fga
tuples:
  - user: user:alice
    relation: member
    object: group:hr
  - user: group:hr#member
    relation: assignee
    object: role:hr-viewer
  - user: role:hr-viewer#assignee
    relation: viewer
    object: resource:hr.employee
  - user: user:bob
    relation: viewer
    object: external_resource:superset-public_dashboard_sales
  - user: application:root
    relation: parent
    object: application:hr
  - user: application:hr
    relation: parent
    object: resource:module
  - user: resource:module
    relation: parent
    object: resource:page-a
  - user: resource:page-a
    relation: parent
    object: resource:salary
  - user: resource:module
    relation: parent
    object: resource:page-b
  - user: resource:module
    relation: parent
    object: external_resource:catalog
  - user: external_resource:catalog
    relation: parent
    object: external_resource:asset
  - user: external_resource:asset
    relation: parent
    object: resource:mixed-child
tests:
  - name: group-role-and-direct-grants
    check:
      - user: user:alice
        object: resource:hr.employee
        assertions: { can_view: true, can_edit: false }
      - user: user:bob
        object: external_resource:superset-public_dashboard_sales
        assertions: { can_view: true, can_share: false }
      - user: user:unrelated
        object: resource:hr.employee
        assertions: { can_view: false }
  - name: leaf-view-keeps-ancestors-siblings-and-component-denied
    tuples:
      - user: user:subject
        relation: viewer
        object: resource:page-a
    check:
      - user: user:subject
        object: application:root
        assertions: { can_view: false, can_create: false, can_edit: false, can_delete: false, can_share: false, can_export: false, can_manage: false }
      - user: user:subject
        object: application:hr
        assertions: { can_view: false, can_create: false, can_edit: false, can_delete: false, can_share: false, can_export: false, can_manage: false }
      - user: user:subject
        object: resource:module
        assertions: { can_view: false, can_create: false, can_edit: false, can_delete: false, can_share: false, can_export: false, can_manage: false }
      - user: user:subject
        object: resource:page-a
