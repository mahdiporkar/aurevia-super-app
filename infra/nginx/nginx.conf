events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  map $http_x_correlation_id $correlation_id { "" $request_id; default $http_x_correlation_id; }
  # Never persist query strings: OIDC callbacks carry short-lived authorization codes
  # and application queries may contain business filters. JSON escaping prevents log forging.
  log_format aurevia_safe escape=json
    '{"time":"$time_iso8601","remoteAddr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"durationSeconds":$request_time,"correlationId":"$correlation_id"}';
  access_log /var/log/nginx/access.log aurevia_safe;
  server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    # Remote entries are selected from the exact admin-managed manifest allowlist.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' http://localhost:3001 http://localhost:3002 http://localhost:3003 http://localhost:3004; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    location = /swagger-ui.html {
      set $bff aurevia-bff;
      proxy_pass http://$bff:8081;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui/ {
      set $bff aurevia-bff;
      proxy_pass http://$bff:8081;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v3/api-docs {
      set $bff aurevia-bff;
      proxy_pass http://$bff:8081;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri /index.html; }
    # Superset 5 emits its compiled frontend assets from an absolute /static path.
    location /static/ {
      set $public_superset public-superset;
      proxy_pass http://$public_superset:8088;
      add_header Cache-Control "public,max-age=86400";
    }
    location /api/v1/ {
      set $bff aurevia-bff;
      if ($http_referer ~* "^https?://[^/]+/(reports-runtime|superset)/") {
        rewrite ^/api/v1/(.*)$ /api/v1/superset/api/v1/$1 break;
      }
      proxy_pass http://$bff:8081;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-CSRFToken $http_x_csrftoken;
      proxy_set_header X-Superset-CSRFToken $http_x_superset_csrftoken;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { set $bff aurevia-bff; proxy_pass http://$bff:8081; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /auth/ { set $bff aurevia-bff; proxy_pass http://$bff:8081; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /hr-micro/ { set $bff aurevia-bff; proxy_pass http://$bff:8081; proxy_set_header Cookie $http_cookie; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /finance-micro/ { set $bff aurevia-bff; proxy_pass http://$bff:8081; proxy_set_header Cookie $http_cookie; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /oauth2/ { set $bff aurevia-bff; proxy_pass http://$bff:8081; proxy_set_header Cookie $http_cookie; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /login { set $bff aurevia-bff; proxy_pass http://$bff:8081; proxy_set_header Cookie $http_cookie; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /reports-runtime/ {
      set $bff aurevia-bff;
      rewrite ^/reports-runtime/(.*)$ /api/v1/superset/$1 break;
      proxy_pass http://$bff:8081;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Referrer-Policy;
      # Superset 5 ships a zero-size Scarf analytics image in its compiled UI.
      # Keep the exception scoped to Superset pages and to the exact image host.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://apachesuperset.gateway.scarf.sh https://static.scarf.sh; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
      add_header X-Content-Type-Options nosniff always;
      # Superset 5 uses root-relative /api/v1 calls. Same-origin referrers let
      # this proxy distinguish them from the Super App's own /api/v1 routes.
      add_header Referrer-Policy same-origin always;
    }
    # Superset 5's frontend uses root-relative endpoints even behind a prefix.
    # These routes still enter Operation exclusively through the Java BFF.
    location /superset/ {
      set $bff aurevia-bff;
      rewrite ^/superset/(.*)$ /api/v1/superset/superset/$1 break;
      proxy_pass http://$bff:8081;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Referrer-Policy;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://apachesuperset.gateway.scarf.sh https://static.scarf.sh; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
    }
    # Dynamic Superset traffic can only reach Operation through BFF -> Gateway:80.
  }
}
