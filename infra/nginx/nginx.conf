events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format session_debug '$request_method $uri status=$status session=$cookie_AUREVIA_SESSION';
  access_log /var/log/nginx/access.log session_debug;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  map $http_x_correlation_id $correlation_id { "" $request_id; default $http_x_correlation_id; }
  server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri /index.html; }
    location /mfe/admin/ { alias /srv/mfe/admin/; add_header Cache-Control "public,max-age=300"; }
    location /mfe/hr/ { alias /srv/mfe/hr/; add_header Cache-Control "public,max-age=300"; }
    location /mfe/finance/ { alias /srv/mfe/finance/; add_header Cache-Control "public,max-age=300"; }
    location /mfe/reports/ { alias /srv/mfe/reports/; add_header Cache-Control "public,max-age=300"; }
    location /api/ { proxy_pass http://host.docker.internal:8081; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /auth/ { proxy_pass http://host.docker.internal:8081; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /oauth2/ { proxy_pass http://host.docker.internal:8081; proxy_set_header Cookie $http_cookie; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /login { proxy_pass http://host.docker.internal:8081; proxy_set_header Cookie $http_cookie; proxy_set_header X-Correlation-ID $correlation_id; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Port 8443; proxy_set_header X-Forwarded-Proto $scheme; }
    location /reports-runtime/ { set $public_superset public-superset; proxy_pass http://$public_superset:8088/; proxy_hide_header X-Frame-Options; }
    # No route to operation-gateway or operation-superset exists in this browser-facing proxy.
  }
}
