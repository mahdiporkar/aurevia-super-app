server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /health {
    default_type application/json;
    return 200 '{"status":"UP","component":"operation-gateway"}';
  }

  location /hr-micro/ {
    proxy_pass http://mock-hr:8080/;
  }
  location /hr-service/ {
    proxy_pass http://mock-hr:8080/;
  }

  location /finance-micro/ {
    proxy_pass http://mock-finance:8080/;
  }
  location /finance-service/ {
    proxy_pass http://mock-finance:8080/;
  }

  # Local proof of the production dual-token contract. Production Gateway must also
  # require the BFF mTLS identity before accepting this private header.
  location /legacy-service/ {
    if ($http_x_internal_legacy_authorization = "") { return 401; }
    proxy_set_header Authorization $http_x_internal_legacy_authorization;
    proxy_set_header X-Internal-Legacy-Authorization "";
    proxy_pass http://mock-hr:8080/;
  }

  # End-to-end development fixture. The browser cannot supply the private
  # header because only the BFF can reach this network. The Gateway replaces
  # the Public IAM bearer and never forwards the private header itself.
  location /legacy-demo/ {
    if ($http_x_internal_legacy_authorization = "") { return 401; }
    rewrite ^/legacy-demo/(.*)$ /api/v1/$1 break;
    proxy_set_header Authorization $http_x_internal_legacy_authorization;
    proxy_set_header X-Internal-Legacy-Authorization "";
    proxy_pass http://mock-legacy:8080;
  }

  # auth_request validates the exact bearer supplied by the Java BFF against
  # Keycloak before the same bearer is forwarded to the OAuth2 demo service.
  location = /_keycloak_userinfo {
    internal;
    proxy_pass http://keycloak:8080/realms/aurevia/protocol/openid-connect/userinfo;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }
  location /oauth-demo/ {
    auth_request /_keycloak_userinfo;
    rewrite ^/oauth-demo/(.*)$ /api/v1/$1 break;
    proxy_set_header X-Demo-Keycloak-Validation passed;
    proxy_pass http://mock-oauth:8080;
  }

  location /superset/ {
    set $operation_superset operation-superset;
    rewrite ^/superset/(.*)$ /$1 break;
    proxy_pass http://$operation_superset:8088;
    # Superset itself is mounted at its native root. /reports-runtime is only
    # the BFF tunnel used for root-level endpoints such as /login; advertising
    # it as the application prefix corrupts the first-login `next` URL.
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Aurevia-Subject $http_x_aurevia_subject;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
  }

  # The origin is selected only by the Java BFF from the approved Superset
  # registry and allowlist. Browser traffic cannot reach this private Gateway.
  location /superset-dynamic/ {
    if ($http_x_internal_superset_origin = "") { return 400; }
    rewrite ^/superset-dynamic/(.*)$ /$1 break;
    proxy_pass $http_x_internal_superset_origin;
    proxy_set_header X-Internal-Superset-Origin "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Aurevia-Subject $http_x_aurevia_subject;
    proxy_set_header X-Aurevia-Issuer $http_x_aurevia_issuer;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
  }
}
