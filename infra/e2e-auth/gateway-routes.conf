# Variables defer Docker DNS lookup until a request, so the demo has no Core startup dependency.
location /test-sso-service/ {
  set $sso_fixture test-sso-service;
  rewrite ^/test-sso-service/(.*)$ /$1 break;
  proxy_set_header X-Internal-Legacy-Authorization "";
  proxy_pass http://$sso_fixture:8091;
}
location /test-legacy-service/ {
  if ($http_x_internal_legacy_authorization = "") { return 401; }
  set $legacy_fixture test-legacy-service;
  rewrite ^/test-legacy-service/(.*)$ /$1 break;
  proxy_set_header Authorization $http_x_internal_legacy_authorization;
  proxy_set_header X-Internal-Legacy-Authorization "";
  proxy_pass http://$legacy_fixture:8092;
}
