server {
  listen 8088;
  server_tokens off;

  location /static/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public,max-age=86400,immutable";
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK";
  }

  location / {
    return 404;
  }
}
