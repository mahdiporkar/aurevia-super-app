name: Feature request
description: Propose a scoped product or platform change
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the user or operational problem.}
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: Desired outcome}
    validations: {required: true}
  - type: textarea
    id: security
    attributes: {label: Authorization and security impact}
