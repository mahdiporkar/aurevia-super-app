name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes: {label: Observed behavior, description: Include exact errors without secrets.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: input
    id: commit
    attributes: {label: Commit or version}
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report contains no credentials, tokens, or private data.
          required: true
