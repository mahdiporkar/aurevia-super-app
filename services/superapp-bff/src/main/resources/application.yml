server:
  port: ${BFF_PORT:8081}
  forward-headers-strategy: framework
  reactive.session.cookie:
    name: AUREVIA_SESSION
    http-only: true
    secure: true
    same-site: lax
spring:
  application.name: superapp-bff
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:change-me}
    ssl.enabled: ${REDIS_TLS:false}
  session:
    timeout: 30m
    # v2 invalidates pre-hardening sessions whose OIDC authority could retain an ID token.
    redis.namespace: aurevia:session:v2
  security.oauth2.client:
    registration.public-iam:
      client-id: ${OIDC_CLIENT_ID:aurevia-bff}
      client-secret: ${OIDC_CLIENT_SECRET:change-me}
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      scope: openid,profile,email
    provider.public-iam:
      authorization-uri: ${OIDC_AUTHORIZATION_URI:http://localhost:8180/realms/aurevia/protocol/openid-connect/auth}
      token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/aurevia/protocol/openid-connect/token}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/aurevia/protocol/openid-connect/certs}
      user-info-uri: ${OIDC_USER_INFO_URI:http://localhost:8180/realms/aurevia/protocol/openid-connect/userinfo}
      # Runtime identity is always issuer + sub. preferred_username is display metadata only.
      user-name-attribute: sub
management.endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    operations-sorter: method
    persist-authorization: false
    tags-sorter: alpha
    try-it-out-enabled: true
    urls:
      - name: 1 - BFF عمومی سوپر اپ
        url: /v3/api-docs
      - name: 2 - سرویس مجوزدهی
        url: /api/v1/docs/authorization/openapi
aurevia:
  token-vault:
    namespace: aurevia:token-vault
    key-id: ${TOKEN_VAULT_KEY_ID:missing}
    key-base64: ${TOKEN_VAULT_KEY_BASE64:missing}
    previous-keys: ${TOKEN_VAULT_PREVIOUS_KEYS:}
  authorization-service:
    base-url: ${AUTHORIZATION_URL:https://authorization-service:8082}
    username: ${AUTH_INTERNAL_USER:bff}
    password: ${AUTH_INTERNAL_PASSWORD:change-me}
  gateway:
    base-url: ${OPERATION_GATEWAY_URL:http://operation-gateway:80}
    mtls-key-store: ${GATEWAY_MTLS_KEYSTORE:}
    mtls-key-store-password: ${GATEWAY_MTLS_KEYSTORE_PASSWORD:}
  superset:
    default-public-instance: ${SUPERSET_DEFAULT_PUBLIC_INSTANCE:public-default}
    allowed-hosts: ${SUPERSET_ALLOWED_HOSTS:operation-superset}
    allowed-ports: ${SUPERSET_ALLOWED_PORTS:8088}
    allow-http: ${SUPERSET_ALLOW_HTTP:true}
  legacy:
    environment: ${LEGACY_ENVIRONMENT:local}
    allowed-hosts: ${LEGACY_ALLOWED_HOSTS:invalid.invalid}
    allowed-ports: ${LEGACY_ALLOWED_PORTS:443}
    allow-insecure-local: ${LEGACY_ALLOW_INSECURE_LOCAL:false}
    local-secrets:
      enabled: ${LEGACY_LOCAL_SECRETS_ENABLED:false}
      json: ${LEGACY_LOCAL_SECRETS_JSON:{}}
    file-secrets:
      enabled: false
      root: ${LEGACY_SECRET_ROOT:.}
    token-vault:
      key-id: ${LEGACY_TOKEN_VAULT_KEY_ID:${TOKEN_VAULT_KEY_ID:missing}}
      key-base64: ${LEGACY_TOKEN_VAULT_KEY_BASE64:${TOKEN_VAULT_KEY_BASE64:missing}}
      previous-keys: ${LEGACY_TOKEN_VAULT_PREVIOUS_KEYS:${TOKEN_VAULT_PREVIOUS_KEYS:}}
  development:
    token-evidence-logging:
      enabled: ${TOKEN_EVIDENCE_LOGGING_ENABLED:false}
# No token exchange is configured or permitted. The outbound adapter forwards the current Public IAM token unchanged.
