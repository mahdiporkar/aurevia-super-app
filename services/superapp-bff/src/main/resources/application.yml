server:
  port: ${BFF_PORT:8081}
  forward-headers-strategy: framework
  reactive.session.cookie:
    name: AUREVIA_SESSION
    http-only: true
    secure: true
    same-site: lax
spring:
  application.name: superapp-bff
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:change-me}
    ssl.enabled: ${REDIS_TLS:false}
  session:
    timeout: 30m
    # v2 invalidates pre-hardening sessions whose OIDC authority could retain an ID token.
    redis.namespace: aurevia:session:v2
management.endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc:
  use-fqn: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    persist-authorization: false
    tags-sorter: alpha
    try-it-out-enabled: true
    urls:
      - name: 1 - BFF عمومی سوپر اپ
        url: /v3/api-docs
      - name: 2 - API عمومی پنل راهبری
        url: /api/v1/docs/admin/openapi
      - name: 3 - سرویس مجوزدهی داخلی
        url: /api/v1/docs/authorization/openapi
aurevia:
  oidc:
    issuer-uri: ${OIDC_ISSUER_URI:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    scopes: ${OIDC_SCOPES:openid,profile,email}
    # Opt in only when browser and container endpoint addresses must differ.
    endpoint-overrides-enabled: ${OIDC_ENDPOINT_OVERRIDES_ENABLED:false}
    authorization-uri: ${OIDC_AUTHORIZATION_URI:}
    token-uri: ${OIDC_TOKEN_URI:}
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
    user-info-uri: ${OIDC_USER_INFO_URI:}
    end-session-uri: ${OIDC_END_SESSION_URI:}
  # Keycloak Admin REST API service account (server-side only, never exposed to browsers).
  keycloak-admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    # Optional: container-reachable Keycloak base URL when it differs from the issuer host.
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:}
  # Same value the Authorization Service uses for the one-time grant; the BFF only verifies it in Keycloak.
  bootstrap:
    admin-sub: ${AUREVIA_BOOTSTRAP_ADMIN_SUB:}
  # Additional (secondary) identity providers only; the primary login never reads this registry.
  identity-providers:
    cache-ttl: ${IDENTITY_PROVIDER_CACHE_TTL:30s}
    request-timeout: ${IDENTITY_PROVIDER_REQUEST_TIMEOUT:10s}
    local-secrets:
      enabled: ${IDENTITY_PROVIDER_LOCAL_SECRETS_ENABLED:false}
      json: ${IDENTITY_PROVIDER_LOCAL_SECRETS_JSON:{}}
    file-secrets:
      root: ${IDENTITY_PROVIDER_SECRET_ROOT:}
  mfe-proxy:
    network-policy: ${UI_ARTIFACT_NETWORK_POLICY:DEVELOPMENT}
    development-host: ${UI_ARTIFACT_DEVELOPMENT_HOST:}
    allowed-private-cidrs: ${UI_ARTIFACT_ALLOWED_PRIVATE_CIDRS:}
    allow-http: ${UI_ARTIFACT_ALLOW_HTTP:true}
    connect-timeout-ms: ${MFE_PROXY_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${MFE_PROXY_RESPONSE_TIMEOUT_MS:10000}
    max-response-bytes: ${MFE_PROXY_MAX_RESPONSE_BYTES:8388608}
  documentation:
    max-openapi-bytes: ${OPENAPI_MAX_BYTES:2097152}
  token-vault:
    namespace: aurevia:token-vault
    key-id: ${TOKEN_VAULT_KEY_ID:missing}
    key-base64: ${TOKEN_VAULT_KEY_BASE64:missing}
    previous-keys: ${TOKEN_VAULT_PREVIOUS_KEYS:}
  authorization-service:
    base-url: ${AUTHORIZATION_URL:https://authorization-service:8082}
    username: ${AUTH_INTERNAL_USER:bff}
    password: ${AUTH_INTERNAL_PASSWORD:change-me}
  gateway:
    base-url: ${OPERATION_GATEWAY_URL:http://operation-gateway:80}
    approved-base-urls: ${OPERATION_GATEWAY_APPROVED_BASE_URLS:}
    mtls-key-store: ${GATEWAY_MTLS_KEYSTORE:}
    mtls-key-store-password: ${GATEWAY_MTLS_KEYSTORE_PASSWORD:}
  superset:
    tls:
      ca-cert-file: ${SUPERSET_TLS_CA_CERT_FILE:}
      client-cert-file: ${SUPERSET_TLS_CLIENT_CERT_FILE:}
      client-key-file: ${SUPERSET_TLS_CLIENT_KEY_FILE:}
      require-mtls: ${SUPERSET_TLS_REQUIRE_MTLS:false}
    network-policy: ${SUPERSET_NETWORK_POLICY:DEVELOPMENT}
    development-host: ${SUPERSET_DEVELOPMENT_HOST:}
    allowed-private-cidrs: ${SUPERSET_ALLOWED_PRIVATE_CIDRS:}
    allow-http: ${SUPERSET_ALLOW_HTTP:true}
    connect-timeout-ms: ${SUPERSET_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${SUPERSET_RESPONSE_TIMEOUT_MS:10000}
  legacy:
    environment: ${LEGACY_ENVIRONMENT:local}
    allowed-hosts: ${LEGACY_ALLOWED_HOSTS:invalid.invalid}
    allowed-ports: ${LEGACY_ALLOWED_PORTS:443}
    allow-insecure-local: ${LEGACY_ALLOW_INSECURE_LOCAL:false}
    local-secrets:
      enabled: ${LEGACY_LOCAL_SECRETS_ENABLED:false}
      json: ${LEGACY_LOCAL_SECRETS_JSON:{}}
    file-secrets:
      enabled: false
      root: ${LEGACY_SECRET_ROOT:.}
    token-vault:
      key-id: ${LEGACY_TOKEN_VAULT_KEY_ID:${TOKEN_VAULT_KEY_ID:missing}}
      key-base64: ${LEGACY_TOKEN_VAULT_KEY_BASE64:${TOKEN_VAULT_KEY_BASE64:missing}}
      previous-keys: ${LEGACY_TOKEN_VAULT_PREVIOUS_KEYS:${TOKEN_VAULT_PREVIOUS_KEYS:}}
  development:
    token-evidence-logging:
      enabled: ${TOKEN_EVIDENCE_LOGGING_ENABLED:false}
# No token exchange is configured or permitted. The outbound adapter forwards the current Public IAM token unchanged.
