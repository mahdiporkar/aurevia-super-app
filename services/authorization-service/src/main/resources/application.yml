server:
  port: ${AUTHORIZATION_PORT:8082}
spring:
  application.name: authorization-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/aurevia_auth}
    username: ${POSTGRES_AUTH_USER:aurevia}
    password: ${POSTGRES_AUTH_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:change-me}
    ssl.enabled: ${REDIS_TLS:false}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  model-and-view-allowed: false
logging:
  error-response.max-bytes: ${LOG_ERROR_RESPONSE_MAX_BYTES:8192}
  retention:
    api-days: ${API_LOG_RETENTION_DAYS:30}
    audit-days: ${AUDIT_LOG_RETENTION_DAYS:365}
    cron: ${LOG_RETENTION_CRON:0 17 2 * * *}
aurevia:
  internal:
    username: ${AUTH_INTERNAL_USER:bff}
    password: ${AUTH_INTERNAL_PASSWORD:change-me}
  openfga:
    base-url: ${OPENFGA_URL:http://localhost:8080}
    store-id: ${OPENFGA_STORE_ID:bootstrap-required}
    model-id: ${OPENFGA_MODEL_ID:}
    cache:
      namespace: ${OPENFGA_CACHE_NAMESPACE:aurevia:openfga:check}
      ttl: ${OPENFGA_CACHE_TTL:5s}
  directory:
    enabled: ${DIRECTORY_SYNC_ENABLED:false}
    url: ${DIRECTORY_LDAP_URL:}
    base-dn: ${DIRECTORY_BASE_DN:}
    bind-dn: ${DIRECTORY_BIND_DN:}
    bind-password: ${DIRECTORY_BIND_PASSWORD:}
    issuer: ${DIRECTORY_ISSUER:http://localhost:8180/realms/aurevia}
    sync-interval-ms: ${DIRECTORY_SYNC_INTERVAL_MS:300000}
    page-size: ${DIRECTORY_PAGE_SIZE:500}
    max-removal-ratio: ${DIRECTORY_MAX_REMOVAL_RATIO:0.25}
    require-tls: ${DIRECTORY_REQUIRE_TLS:false}
  ui-artifacts:
    allowed-origins: ${UI_ARTIFACT_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}
    allow-http: ${UI_ARTIFACT_ALLOW_HTTP:true}
    require-integrity: ${UI_ARTIFACT_REQUIRE_INTEGRITY:false}
