openapi: 3.0.3
info: {title: Aurevia Internal Authorization Service, version: 0.2.0}
security: [{workloadIdentity: []}]
paths:
  /internal/v1/authorize/check:
    post:
      operationId: checkAuthorization
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CheckRequest'}}}}
      responses: {'200': {description: ALLOW or DENY decision}}
  /internal/v1/authorize/check-batch:
    post: {operationId: checkAuthorizationBatch, responses: {'200': {description: Decisions in request order}}}
  /internal/v1/subjects/{id}/manifest:
    get:
      operationId: effectiveManifest
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Effective panels, permissions, and authorized resource tree with ancestors}}
  /internal/v1/identity/login-sync:
    post: {operationId: synchronizeLoginIdentity, responses: {'200': {description: Identity projection synchronized}}}
  /internal/v1/routes/resolve:
    get:
      operationId: resolveOperationalRoute
      parameters:
        - {in: query, name: path, required: true, schema: {type: string, pattern: '^/'}}
        - {in: query, name: method, required: true, schema: {type: string}}
      responses: {'200': {description: Resource/action and enforcement limits}, '404': {description: No registered operation}}
  /internal/v1/registry/service-targets:
    get: {operationId: listServiceTargets, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Approved gateway targets}}}
    post: {operationId: createServiceTarget, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'201': {description: Target created}, '400': {description: SSRF or validation rejection}, '409': {description: Duplicate code}}}
  /internal/v1/registry/proxy-routes:
    get: {operationId: listProxyRoutes, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Deterministic proxy routes}}}
    post: {operationId: createProxyRoute, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'201': {description: Route created}, '409': {description: Prefix collision}}}
  /internal/v1/registry/proxy-routes/validate:
    post: {operationId: validateProxyRoute, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Canonical prefix}, '400': {description: Unsafe route}, '409': {description: Ambiguous route}}}
  /internal/v1/registry/proxy-routes/preview:
    post: {operationId: previewProxyRewrite, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Sanitized incoming and upstream paths}}}
  /internal/v1/registry/proxy-routes/resolve-test:
    post: {operationId: testProxyResolution, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Matching route and operation}, '404': {description: No match}, '409': {description: Ambiguous match}}}
  /internal/v1/registry/proxy-routes/{routeId}/operations:
    parameters: [{in: path, name: routeId, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: listRouteOperations, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Route operation mappings}}}
    post: {operationId: createRouteOperation, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'201': {description: Operation created}, '400': {description: Invalid Resource/Action or pattern}}}
  /internal/v1/registry/grants:
    post:
      operationId: createGrant
      parameters: [{$ref: '#/components/parameters/Actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrantWrite'}}}}
      responses: {'201': {description: Grant and outbox event created}, '403': {description: Admin permission required}, '409': {description: Active grant exists}}
  /internal/v1/registry/resource-tree:
    get: {operationId: resourceTree, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Complete seven-type resource catalog with actions and grant counts}}}
  /internal/v1/registry/resource-types:
    get: {operationId: resourceTypes, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Supported resource type names}}}
  /internal/v1/registry/subjects/{type}/{id}/grants:
    get:
      operationId: subjectGrants
      parameters:
        - {$ref: '#/components/parameters/Actor'}
        - {in: path, name: type, required: true, schema: {type: string, enum: [USER, GROUP, ROLE]}}
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Active direct grants for the selected subject}}
  /internal/v1/registry/grants/{id}:
    delete:
      operationId: revokeGrant
      parameters:
        - {$ref: '#/components/parameters/Actor'}
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses: {'204': {description: Grant archived and delete event enqueued}}
  /internal/v1/registry/roles:
    get: {operationId: listRoles, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Roles}}}
    post: {operationId: createRole, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'201': {description: Role created}}}
  /internal/v1/registry/role-assignments:
    get: {operationId: listRoleAssignments, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Assignments}}}
    post: {operationId: assignRole, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'201': {description: Role assigned}}}
  /internal/v1/registry/outbound-auth-profiles:
    get: {operationId: listOutboundAuthProfiles, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'200': {description: Sanitized profile metadata}}}
    post: {operationId: createOutboundAuthProfile, parameters: [{$ref: '#/components/parameters/Actor'}], responses: {'201': {description: Profile created}, '400': {description: Unsafe metadata rejected}}}
  /internal/v1/registry/outbound-auth-profiles/{id}:
    get: {operationId: getOutboundAuthProfile, parameters: [{$ref: '#/components/parameters/Actor'}, {in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Profile metadata}}}
    put: {operationId: updateOutboundAuthProfile, parameters: [{$ref: '#/components/parameters/Actor'}, {in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: query, name: version, required: true, schema: {type: integer, format: int64}}], responses: {'200': {description: Optimistic update}, '409': {description: Version conflict}}}
  /internal/v1/registry/outbound-auth-profiles/{id}/status:
    patch: {operationId: changeOutboundAuthProfileStatus, parameters: [{$ref: '#/components/parameters/Actor'}, {in: path, name: id, required: true, schema: {type: string, format: uuid}}, {in: query, name: version, required: true, schema: {type: integer, format: int64}}], responses: {'200': {description: Status changed}}}
  /internal/v1/registry/outbound-auth-profiles/{id}/usage:
    get: {operationId: outboundAuthProfileUsage, parameters: [{$ref: '#/components/parameters/Actor'}, {in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Referencing targets}}}
components:
  securitySchemes:
    workloadIdentity: {type: http, scheme: basic, description: Local bootstrap; production requires mTLS.}
  parameters:
    Actor: {in: header, name: X-Actor, required: true, schema: {type: string}}
  schemas:
    CheckRequest:
      type: object
      required: [subjectId, issuer, resource, action, correlationId]
      properties:
        subjectId: {type: string}
        issuer: {type: string}
        resource: {type: string}
        action: {type: string}
        context: {type: object, additionalProperties: true}
        correlationId: {type: string}
    GrantWrite:
      type: object
      required: [resourceId, actionId, relation]
      properties:
        userId: {type: string, format: uuid, deprecated: true}
        subjectType: {type: string, enum: [USER, GROUP, ROLE]}
        subjectId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        actionId: {type: string, format: uuid}
        relation: {type: string}
        expiresAt: {type: string, format: date-time, nullable: true}
