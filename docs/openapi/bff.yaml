openapi: 3.0.3
info: {title: Aurevia Browser BFF, version: 0.2.0}
servers: [{url: /, description: Same-origin ingress}]
paths:
  /api/v1/csrf:
    get: {responses: {'200': {description: CSRF header name and token}}}
  /api/v1/me:
    get: {security: [{browserSession: []}], responses: {'200': {description: Current principal}, '401': {description: Login required}}}
  /api/v1/me/manifest:
    get: {security: [{browserSession: []}], responses: {'200': {description: Backward-compatible effective manifest plus the versioned, user-filtered uiCatalog}}}
  /api/proxy/{serviceSlug}/{path}:
    parameters: [{in: path, name: serviceSlug, required: true, schema: {type: string}}, {in: path, name: path, required: false, schema: {type: string}}]
    get: {security: [{browserSession: []}], responses: {'200': {description: Registry-resolved operational response}, '403': {description: Operation denied}, '404': {description: Disabled or unknown route}}}
  /api/v1/admin/{path}:
    parameters: [{in: path, name: path, required: true, schema: {type: string}}]
    get: {security: [{browserSession: []}], responses: {'200': {description: Registry response}, '403': {description: Admin required}}}
    post: {security: [{browserSession: [], csrf: []}], responses: {'200': {description: Registry response}, '403': {description: Admin required}}}
    put: {security: [{browserSession: [], csrf: []}], responses: {'200': {description: Registry response}}}
    delete: {security: [{browserSession: [], csrf: []}], responses: {'204': {description: Mutation accepted}}}
  /api/v1/admin/service-targets/{id}/health-check:
    post:
      security: [{browserSession: [], csrf: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Server-side check through the fixed Operational Gateway client}, '403': {description: proxy.target permission required}}
  /api/v1/admin/outbound-auth-profiles/{id}/token-test:
    post: {security: [{browserSession: [], csrf: []}], parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Sanitized result only; token is never returned}, '502': {description: Sanitized failure}}}
  /api/v1/admin/outbound-auth-profiles/{id}/invalidate-token:
    post: {security: [{browserSession: [], csrf: []}], parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Encrypted Legacy token cache invalidated}}}
  /api/v1/admin/outbound-auth-profiles/{id}/cache-status:
    get: {security: [{browserSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Boolean status only}}}
  /hr-micro/{path}:
    parameters: [{in: path, name: path, required: true, schema: {type: string}}]
    get: {security: [{browserSession: []}], responses: {'200': {description: Authorized upstream response}, '403': {description: Denied}, '404': {description: Unregistered operation}}}
  /finance-micro/{path}:
    parameters: [{in: path, name: path, required: true, schema: {type: string}}]
    post: {security: [{browserSession: [], csrf: []}], responses: {'200': {description: Authorized upstream response}, '403': {description: Denied}, '413': {description: Body too large}}}
  /{panelSlug}/{path}:
    parameters:
      - {in: path, name: panelSlug, required: true, schema: {type: string}}
      - {in: path, name: path, required: true, schema: {type: string}}
    get: {security: [{browserSession: []}], responses: {'200': {description: Dynamically resolved authorized response}, '403': {description: OpenFGA denial}, '404': {description: Inactive or unregistered route/operation}, '409': {description: Ambiguous configuration rejected}}}
components:
  securitySchemes:
    browserSession: {type: apiKey, in: cookie, name: AUREVIA_SESSION}
    csrf: {type: apiKey, in: header, name: X-CSRF-TOKEN}
