stages: [validate, test, build, security]
variables: {MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository", npm_config_cache: ".npm"}
cache: {paths: [.m2/repository, .npm]}
frontend:
  image: node:22.15.0-bookworm-slim
  stage: test
  script: [npm ci, npm run typecheck, npm test, npm run build, npm audit --omit=dev]
  artifacts: {paths: [apps/*/dist], expire_in: 1 week}
backend:
  image: maven:3.9.16-eclipse-temurin-21
  stage: test
  # Real PostgreSQL, Redis and OpenFGA: the permission integration tests must execute here.
  services:
    - {name: "postgres:16-alpine", alias: postgres}
    - {name: "redis:7-alpine", alias: redis, command: ["redis-server", "--requirepass", "ci-redis"]}
    - {name: "openfga/openfga:v1.8.0", alias: openfga, command: ["run"]}
  variables:
    POSTGRES_PASSWORD: postgres
    AUREVIA_TEST_JDBC_URL: "jdbc:postgresql://postgres:5432/postgres"
    AUREVIA_TEST_JDBC_USER: postgres
    AUREVIA_TEST_JDBC_PASSWORD: postgres
    AUREVIA_TEST_OPENFGA_URL: "http://openfga:8080"
    AUREVIA_TEST_REDIS_HOST: redis
    AUREVIA_TEST_REDIS_PORT: "6379"
    AUREVIA_TEST_REDIS_PASSWORD: ci-redis
  script:
    - mvn -B verify
    - node tools/verify-permission-integration-tests.mjs
compose:
  image: docker:29.1.2-cli
  stage: validate
  script:
    - docker compose -f infra/docker-compose/compose.yml config --quiet
    - docker compose -f infra/docker-compose/compose.yml -f infra/docker-compose/compose.development.yml config --quiet
sbom:
  image: anchore/syft:v1.31.0
  stage: security
  script: [syft dir:. -o cyclonedx-json=sbom.cdx.json]
  artifacts: {paths: [sbom.cdx.json]}
